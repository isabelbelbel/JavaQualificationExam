spring.application.name=JavaQualificationExam
server.port=6767

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/java_qualification_exam
spring.datasource.username=${DB_USERNAME:icmorales}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Text audit log
audit.file.path=logs/audit.txt

# Security
app.security.username=${API_USERNAME:icmorales}
app.security.password=${API_PASSWORD:efas}
